<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5857 Inc.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #fafafa;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #ccc;
      font-size: 1.1rem;
    }

    nav {
      background: #16213e;
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    section {
      margin-bottom: 2.5rem;
    }

    h2 {
      margin-bottom: 0.75rem;
      color: #1a1a2e;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Your Name / Site Title</h1>
    <p>A short tagline about what this site is</p>
  </header>

  <nav>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <section id="about">
      <h2>About</h2>
      <p>
        More yo come!
        Games, Books, Apps
      </p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>
        Email: <a href="mailto:adam@5857.ca">adam@5857.ca</a>
      </p>
    </section>
  </main>

  <footer>
    &copy; 2026 5857 Inc. All rights reserved.
  </footer>

</body>
</html>
